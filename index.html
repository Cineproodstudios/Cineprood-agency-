
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CINEPROOD | Tradicional • IA • Híbrido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://player.vimeo.com">
    <link rel="preconnect" href="https://i.vimeocdn.com">
    <link rel="preconnect" href="https://f.vimeocdn.com">
    <link rel="preconnect" href="https://i.postimg.cc">
    <link rel="preconnect" href="https://www.tiktok.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Inter:wght@400;700;900&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        .font-cinematic {
            font-family: 'Cinzel', Georgia, serif;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .dark body {
            background-color: #000000;
            color: #ffffff;
        }

        html:not(.dark) body {
            background-color: #ffffff;
            color: #000000;
        }

        .font-mono {
            font-family: 'Space Mono', monospace;
        }

        .reveal-hidden {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Smooth scroll behavior */
        html {
            scroll-behavior: smooth;
        }

        /* Compensate fixed navbar height for anchor jumps */
        section {
            scroll-margin-top: 80px;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        .dark ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #333;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #000;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #ffffff;
        }

        /* Liquid Glass Animation */
        @keyframes liquidGlassSheen {
            0% {
                transform: translateX(-160%) skewX(-20deg);
            }
            35%, 100% {
                transform: translateX(240%) skewX(-20deg);
            }
        }

        .animate-liquid-glass {
            animation: liquidGlassSheen 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* Optical Prism & Spectral Dispersion Animations */
        @keyframes spectralCaustics {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .prism-caustics-layer {
            background: linear-gradient(
                125deg,
                rgba(255, 0, 80, 0.12) 0%,
                rgba(160, 40, 255, 0.08) 22%,
                rgba(0, 220, 255, 0.12) 48%,
                rgba(255, 230, 80, 0.06) 74%,
                rgba(255, 0, 80, 0.10) 100%
            );
            background-size: 280% 280%;
            animation: spectralCaustics 14s ease infinite;
        }

        .prism-edge-refraction {
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.3),
                inset 0 -1px 2px rgba(0, 220, 255, 0.2),
                -1px 0 3px rgba(255, 0, 80, 0.25),
                1px 0 3px rgba(0, 220, 255, 0.25);
        }

        /* Micro Overshoot Camera Settling Keyframes */
        @keyframes xeniaOvershoot {
            0% {
                transform: scale(1.06);
            }
            45% {
                transform: scale(0.995);
            }
            100% {
                transform: scale(1.00);
            }
        }

        .animate-xenia-overshoot {
            animation: xeniaOvershoot 380ms cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Impact Flash Frame */
        @keyframes impactFlash {
            0% {
                opacity: 0;
            }
            30% {
                opacity: 0.95;
            }
            100% {
                opacity: 0;
            }
        }

        .animate-impact-flash {
            animation: impactFlash 130ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Cinematic Letterbox Retract */
        @keyframes letterboxRetractTop {
            0% {
                transform: translateY(0%);
            }
            100% {
                transform: translateY(-100%);
            }
        }
        @keyframes letterboxRetractBottom {
            0% {
                transform: translateY(0%);
            }
            100% {
                transform: translateY(100%);
            }
        }

        .animate-letterbox-retract-top {
            animation: letterboxRetractTop 500ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-letterbox-retract-bottom {
            animation: letterboxRetractBottom 500ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Presentation Video & Short Film: Desktop vs Mobile Responsive */
        @media (min-width: 769px) {
            .vimeo-native-wrapper {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            .vimeo-native-wrapper iframe {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 100vw;
                height: 56.25vw; /* 16:9 ratio */
                min-height: 100%;
                min-width: 177.77dvh; /* 16:9 ratio in dynamic viewport height */
                transform: translate(-50%, -50%);
                border: 0;
                pointer-events: none;
            }
        }

        @media (max-width: 768px) {
            html,
            body {
                max-width: 100vw;
                overflow-x: clip;
                -webkit-overflow-scrolling: touch;
                -webkit-tap-highlight-color: transparent;
            }

            section {
                scroll-margin-top: calc(60px + env(safe-area-inset-top, 0px));
                max-width: 100%;
                overflow-x: clip;
            }

            /* Faster, crisp mobile reveal so content never lags behind fast touch scroll */
            .reveal-hidden {
                transform: translateY(14px);
                transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.32s cubic-bezier(0.16, 1, 0.3, 1);
            }

            /* Lighter backdrop blur on mobile GPUs for 60fps continuous scroll */
            nav {
                backdrop-filter: blur(10px) saturate(130%) !important;
                -webkit-backdrop-filter: blur(10px) saturate(130%) !important;
            }

            .mobile-nav-bar {
                padding-top: max(0.75rem, env(safe-area-inset-top, 0px)) !important;
                padding-bottom: 0.75rem !important;
                padding-left: env(safe-area-inset-left, 0px);
                padding-right: env(safe-area-inset-right, 0px);
            }

            .mobile-hero {
                min-height: 100dvh !important;
                height: auto !important;
                padding-top: calc(5.5rem + env(safe-area-inset-top, 0px)) !important;
                padding-bottom: calc(3rem + env(safe-area-inset-bottom, 0px)) !important;
                width: 100%;
                max-width: 100vw;
                overflow-x: clip;
            }

            .mobile-hero-title {
                font-size: clamp(2.15rem, 11.2vw, 3.85rem) !important;
                letter-spacing: -0.03em !important;
            }

            .mobile-hero-cta {
                backdrop-filter: blur(8px) !important;
                -webkit-backdrop-filter: blur(8px) !important;
                min-height: 48px;
                padding: 0.875rem 1.35rem !important;
                letter-spacing: 0.24em !important;
                width: 100%;
                max-width: 280px;
            }

            .video-stage {
                min-height: 76dvh;
                height: auto;
                padding-top: 2rem;
                padding-bottom: calc(4.75rem + env(safe-area-inset-bottom, 0px));
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000000;
                overflow: hidden;
            }
            .vimeo-native-wrapper {
                position: relative !important;
                width: 100% !important;
                max-width: 100vw !important;
                aspect-ratio: 16 / 9 !important;
                height: auto !important;
                min-height: 0 !important;
                overflow: hidden !important;
                background: #000000 !important;
            }
            .vimeo-native-wrapper iframe {
                position: absolute !important;
                inset: 0 !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: 100% !important;
                min-width: 0 !important;
                min-height: 0 !important;
                max-width: 100% !important;
                max-height: 100% !important;
                transform: none !important;
                object-fit: contain !important;
                border: 0 !important;
                pointer-events: none !important;
            }

            .short-film-poster {
                width: 100% !important;
                aspect-ratio: 16 / 9 !important;
                height: auto !important;
                min-height: 0 !important;
                overflow: hidden !important;
                background: #000000 !important;
            }
            .short-film-poster img {
                width: 100% !important;
                height: 100% !important;
                object-fit: contain !important;
            }

            /* Mobile safe horizontal scroll strip for Fotos */
            .mobile-scroll-strip {
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            .mobile-scroll-strip::-webkit-scrollbar {
                display: none;
            }

            /* Ensure third-party social embeds never overflow 320px viewports */
            .mobile-embed-box iframe,
            .mobile-embed-box blockquote {
                max-width: 100% !important;
                min-width: 0 !important;
            }
        }

        /* Subtle indicator release bounce: translateY(0px) -> translateY(4px) -> translateY(0px) */
        @keyframes bounceSubtle {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(4px);
            }
        }

        .animate-bounce-subtle {
            animation: bounceSubtle 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* Client Folder Cards — Transparent Logo Overlay & Desktop Hover Reveal */
        .client-card .client-cover {
            transform: scale(1);
            filter: brightness(0.92);
            transition:
                transform 400ms cubic-bezier(0.16, 1, 0.3, 1),
                filter 360ms cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
        }

        .client-card .client-overlay {
            background:
                radial-gradient(circle at 50% 42%, rgba(0, 0, 0, 0.28) 0%, rgba(0, 0, 0, 0.18) 58%, rgba(0, 0, 0, 0.24) 100%);
            opacity: 1;
            transition: opacity 340ms cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity;
        }

        .client-card .client-meta-scrim {
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.86) 0%,
                rgba(0, 0, 0, 0.42) 34%,
                rgba(0, 0, 0, 0) 64%
            );
            opacity: 0.92;
            transition: opacity 340ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .client-card .client-logo-wrap {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition:
                opacity 320ms cubic-bezier(0.16, 1, 0.3, 1),
                transform 360ms cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }

        .client-card .client-logo {
            background: transparent;
            object-fit: contain;
            filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.48));
        }

        .client-card .client-meta-inner {
            transform: translateY(0);
            transition: transform 340ms cubic-bezier(0.16, 1, 0.3, 1);
        }

        .client-card .client-arrow {
            transition: transform 280ms cubic-bezier(0.16, 1, 0.3, 1), color 240ms ease;
        }

        @media (hover: hover) and (pointer: fine) {
            .client-card:hover .client-logo-wrap,
            .client-card:focus-visible .client-logo-wrap {
                opacity: 0;
                transform: translateY(-6px) scale(0.96);
            }

            .client-card:hover .client-overlay,
            .client-card:focus-visible .client-overlay {
                opacity: 0;
            }

            .client-card:hover .client-meta-scrim,
            .client-card:focus-visible .client-meta-scrim {
                opacity: 0.72;
            }

            .client-card:hover .client-cover,
            .client-card:focus-visible .client-cover {
                transform: scale(1.03);
                filter: brightness(1);
            }

            .client-card:hover .client-meta-inner,
            .client-card:focus-visible .client-meta-inner {
                transform: translateY(-3px);
            }

            .client-card:hover .client-arrow,
            .client-card:focus-visible .client-arrow {
                transform: translateX(4px);
                color: #ef4444;
            }
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
