
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEPROOD | Tradicional • IA • Híbrido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://player.vimeo.com">
    <link rel="preconnect" href="https://i.vimeocdn.com">
    <link rel="preconnect" href="https://f.vimeocdn.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .dark body {
            background-color: #000000;
            color: #ffffff;
        }

        html:not(.dark) body {
            background-color: #ffffff;
            color: #000000;
        }

        .font-mono {
            font-family: 'Space Mono', monospace;
        }

        .reveal-hidden {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Smooth scroll behavior */
        html {
            scroll-behavior: smooth;
        }

        /* Compensate fixed navbar height for anchor jumps */
        section {
            scroll-margin-top: 80px;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        .dark ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #333;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #000;
        }
        .dark ::-webkit-scrollbar-thumb:hover {
            background: #ffffff;
        }

        /* Liquid Glass Animation */
        @keyframes liquidGlassSheen {
            0% {
                transform: translateX(-160%) skewX(-20deg);
            }
            35%, 100% {
                transform: translateX(240%) skewX(-20deg);
            }
        }

        .animate-liquid-glass {
            animation: liquidGlassSheen 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* Optical Prism & Spectral Dispersion Animations */
        @keyframes spectralCaustics {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .prism-caustics-layer {
            background: linear-gradient(
                125deg,
                rgba(255, 0, 80, 0.12) 0%,
                rgba(160, 40, 255, 0.08) 22%,
                rgba(0, 220, 255, 0.12) 48%,
                rgba(255, 230, 80, 0.06) 74%,
                rgba(255, 0, 80, 0.10) 100%
            );
            background-size: 280% 280%;
            animation: spectralCaustics 14s ease infinite;
        }

        .prism-edge-refraction {
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.3),
                inset 0 -1px 2px rgba(0, 220, 255, 0.2),
                -1px 0 3px rgba(255, 0, 80, 0.25),
                1px 0 3px rgba(0, 220, 255, 0.25);
        }

        /* Micro Overshoot Camera Settling Keyframes */
        @keyframes xeniaOvershoot {
            0% {
                transform: scale(1.06);
            }
            45% {
                transform: scale(0.995);
            }
            100% {
                transform: scale(1.00);
            }
        }

        .animate-xenia-overshoot {
            animation: xeniaOvershoot 380ms cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* Impact Flash Frame */
        @keyframes impactFlash {
            0% {
                opacity: 0;
            }
            30% {
                opacity: 0.95;
            }
            100% {
                opacity: 0;
            }
        }

        .animate-impact-flash {
            animation: impactFlash 130ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Cinematic Letterbox Retract */
        @keyframes letterboxRetractTop {
            0% {
                transform: translateY(0%);
            }
            100% {
                transform: translateY(-100%);
            }
        }
        @keyframes letterboxRetractBottom {
            0% {
                transform: translateY(0%);
            }
            100% {
                transform: translateY(100%);
            }
        }

        .animate-letterbox-retract-top {
            animation: letterboxRetractTop 500ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-letterbox-retract-bottom {
            animation: letterboxRetractBottom 500ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Fullscreen Edge-to-Edge Vimeo Player Integration */
        .vimeo-native-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        .vimeo-native-wrapper iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw; /* 16:9 ratio */
            min-height: 100%;
            min-width: 177.77dvh; /* 16:9 ratio in dynamic viewport height */
            transform: translate(-50%, -50%);
            border: 0;
            pointer-events: none;
        }

        /* Subtle indicator release bounce: translateY(0px) -> translateY(4px) -> translateY(0px) */
        @keyframes bounceSubtle {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(4px);
            }
        }

        .animate-bounce-subtle {
            animation: bounceSubtle 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
